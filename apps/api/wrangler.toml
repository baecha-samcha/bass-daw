# Cloudflare Workers 설정 초안 — 배포하지 않았다. 실제 계정·D1·R2·도메인은 D07/D08 선택 후 사용자가 만든다.
# 기본값은 production 방어 상태: AUTH_MODE="none"(공급자 미설정 → 인증 필요 API 는 503), fake auth 없음.
# fake auth 값은 로컬 전용 .dev.vars(gitignore)에만 둔다. 이 파일에 secret 을 넣지 않는다(wrangler secret put 사용).
name = "bass-daw-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
AUTH_MODE = "none"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "" # D07: 앱 도메인 선택 후 입력
# D08 확정 전 제안 한도(바이트). 배포 직전 사용자 승인 필요.
CHUNK_BYTES = "8388608"
MAX_ASSET_BYTES = "1073741824"
QUOTA_BYTES = "1073741824"
URL_TTL_SEC = "900"
TOMBSTONE_RETENTION_DAYS = "30"

# secrets(값은 저장소에 두지 않음): SIGNING_SECRET, (공급자 선택 후) 공급자 client secret 등

[[d1_databases]]
binding = "DB"
database_name = "bass-daw"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder — 실제 D1 생성 전
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bass-daw-private" # placeholder — private bucket(공개 접근 없음)

[triggers]
crons = ["17 3 * * *"] # GC(만료 업로드·orphan). 물리 삭제(purge)는 MVP-7 에서 하지 않는다.
